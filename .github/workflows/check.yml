# Build and test flake-sync on every push and pull request.
#
# Two jobs so a syntax or formatting mistake reports in under a minute
# instead of behind the VM boot: `package` builds the derivation (which
# shellchecks the script) and runs the formatter check, while `vm`
# drives the packaged executable through the full convergence lifecycle
# against a fake GitHub of local bare repos. Both are subsets of
# `nix flake check`, which is what a contributor runs locally.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package + format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Building the package shellchecks the script and proves its
      # declared runtime closure is complete.
      - name: Build the package
        run: nix build --no-link --print-build-logs '.#checks.x86_64-linux.package'

      - name: Check formatting
        run: nix build --no-link --print-build-logs '.#checks.x86_64-linux.treefmt'

  vm:
    name: VM lifecycle test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      # A NixOS VM that converges a workspace of local bare repos: no
      # network, nothing real is touched.
      - name: Run the lifecycle test
        run: nix build --no-link --print-build-logs '.#checks.x86_64-linux.vm-lifecycle'
